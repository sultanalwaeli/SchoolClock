
<!-- نافذة عرض المناوبين - الإصدار 15.2 -->
<style>
  #dutyPopup {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0, 10, 25, .82);
    backdrop-filter: blur(7px);
    direction: rtl;
    box-sizing: border-box;
  }

  #dutyPopup.open {
    display: flex;
  }

  #dutyPopup .popupPanel {
    width: min(950px, 96vw);
    max-height: 88vh;
    overflow-y: auto;
    padding: 26px;
    border: 1px solid #42627a;
    border-radius: 24px;
    background: #0b2942;
    color: #fff;
    box-shadow: 0 20px 80px #0008;
    box-sizing: border-box;
  }

  #dutyPopup .popupHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 24px;
  }

  #dutyPopup h2 {
    margin: 0;
    font-size: 27px;
  }

  #dutyPopup .closePopup {
    background: #213f58;
    color: white;
    border: 1px solid #54718a;
    border-radius: 12px;
    padding: 12px 22px;
    cursor: pointer;
    font-size: 18px;
  }

  #dutyPopup .chiefCard {
    border: 1px solid #d5a83e;
    border-radius: 15px;
    background: #263e4b;
    padding: 20px;
    margin-bottom: 22px;
  }

  #dutyPopup .chiefLabel {
    display: block;
    color: #ffd15a;
    font-weight: bold;
    margin-bottom: 8px;
  }

  #dutyPopup .chiefName {
    font-size: 24px;
    font-weight: bold;
  }

  #dutyPopup .membersGrid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  #dutyPopup .memberCard {
    padding: 15px;
    background: #203e58;
    border: 1px solid #46617b;
    border-radius: 12px;
    font-size: 19px;
    font-weight: bold;
  }

  #dutyPopup .memberNumber {
    color: #5cdae8;
    margin-left: 12px;
  }

  #dutyPopup .popupCount {
    color: #b8cfdf;
    margin-bottom: 18px;
  }

  @media (max-width: 600px) {
    #dutyPopup .membersGrid {
      grid-template-columns: 1fr;
    }
    #dutyPopup .popupPanel {
      padding: 16px;
    }
  }
</style>

<div id="dutyPopup"
     role="dialog"
     aria-modal="true"
     aria-labelledby="dutyPopupTitle"
     onclick="if(event.target===this) closeDutyPopup()">

  <div class="popupPanel">

    <div class="popupHeader">
      <h2 id="dutyPopupTitle">المناوبة اليومية</h2>
      <button class="closePopup"
              onclick="closeDutyPopup()">
        ✕ إغلاق
      </button>
    </div>

    <div class="popupCount" id="dutyPopupCount"></div>

    <div id="dutyPopupChief"></div>

    <div class="membersGrid" id="dutyPopupMembers"></div>

  </div>
</div>

<script>
  function openDutyPopup() {
    const day = new Date().getDay();

    const people =
      (typeof remoteDutyDays !== "undefined"
        ? remoteDutyDays?.[day]
        : null) || [];

    const dayNames = [
      "الأحد",
      "الاثنين",
      "الثلاثاء",
      "الأربعاء",
      "الخميس",
      "الجمعة",
      "السبت"
    ];

    const chiefs = people.filter(p => p.chief);
    const members = people.filter(p => !p.chief);

    const escapeHTML = value =>
      String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));

    document.getElementById("dutyPopupTitle")
      .textContent = "مناوبة يوم " + dayNames[day];

    document.getElementById("dutyPopupCount")
      .textContent = "إجمالي المناوبين: " + people.length;

    document.getElementById("dutyPopupChief").innerHTML =
      chiefs.map(p => `
        <div class="chiefCard">
          <span class="chiefLabel">★ رئيس المناوبة</span>
          <div class="chiefName">${escapeHTML(p.name)}</div>
        </div>
      `).join("");

    document.getElementById("dutyPopupMembers").innerHTML =
      members.map((p, i) => `
        <div class="memberCard">
          <span class="memberNumber">${i + 1}</span>
          ${escapeHTML(p.name)}
        </div>
      `).join("");

    document.getElementById("dutyPopup")
      .classList.add("open");
  }

  function closeDutyPopup() {
    document.getElementById("dutyPopup")
      .classList.remove("open");
  }

  // ربط زر المناوبين الموجود في الساعة بالنافذة الجديدة
  document.addEventListener("click", function(event) {
    const button = event.target.closest(".remoteDutyToggle");
    if (!button) return;

    event.preventDefault();
    event.stopImmediatePropagation();
    openDutyPopup();
  }, true);

  // إغلاق النافذة بمفتاح Escape
  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") closeDutyPopup();
  });
</script>
